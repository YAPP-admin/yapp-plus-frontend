glob_matcher: doublestar

commit-msg:
  commands:
    commitlint:
      run: mise exec -- pnpm commitlint --edit "{1}"

pre-commit:
  commands:
    format:
      glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,scss,md,mdx,yml,yaml,toml,graphql,gql}'
      exclude: '**/routeTree.gen.ts'
      run: mise exec -- pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '**/*.{js,jsx,ts,tsx,mjs,cjs}'
      exclude: '**/routeTree.gen.ts'
      # 생성 파일만 커밋하면 oxlint 제외 규칙에 따라 검사 대상이 없을 수 있습니다.
      run: mise exec -- pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}

pre-push:
  commands:
    typecheck:
      run: mise exec -- node --run typecheck
