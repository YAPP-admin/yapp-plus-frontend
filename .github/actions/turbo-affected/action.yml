name: Detect affected Turbo build
description: Git 변경 범위가 특정 workspace의 Turbo build task에 영향을 주는지 확인합니다.

inputs:
  workspace:
    description: 영향을 확인할 pnpm workspace 이름입니다.
    required: true
  base:
    description: 비교를 시작할 Git ref입니다.
    required: false
    default: ''
  head:
    description: 비교를 끝낼 Git ref입니다.
    required: false
    default: ''
  force-all:
    description: Git 범위를 결정할 수 없을 때 안전하게 영향을 받은 것으로 처리합니다.
    required: false
    default: 'false'
  deployment-config-paths:
    description: 변경되면 앱 영향도와 무관하게 배포를 실행할 배포 설정 파일 목록입니다.
    required: false
    default: ''

outputs:
  affected:
    description: workspace의 build task가 영향을 받았으면 true입니다.
    value: ${{ steps.detect.outputs.affected }}

runs:
  using: composite
  steps:
    - name: Detect affected build
      id: detect
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
        DEPLOYMENT_CONFIG_PATHS: ${{ inputs.deployment-config-paths }}
        FORCE_ALL: ${{ inputs.force-all }}
        HEAD_SHA: ${{ inputs.head }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        if [ "$FORCE_ALL" = "true" ]; then
          # 첫 push처럼 이전 commit이 없으면 배포 누락보다 전체 배포가 안전합니다.
          affected=true
        elif [ -n "$DEPLOYMENT_CONFIG_PATHS" ] &&
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            grep -Fxq -f <(printf '%s\n' "$DEPLOYMENT_CONFIG_PATHS" | sed '/^[[:space:]]*$/d'); then
          # 배포 절차 자체가 바뀌면 앱 그래프 변경이 없어도 새 배포 경로를 검증합니다.
          affected=true
        else
          # 배포 job은 의존성을 설치한 Verify job과 runner를 공유하지 않으므로 고정된 Turbo 버전을 실행합니다.
          turbo_version="$(node -p "require('./package.json').devDependencies.turbo")"
          affected="$(
            pnpm dlx "turbo@$turbo_version" --no-color query affected \
              --packages "$WORKSPACE" \
              --tasks build \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" |
              jq -r '.data.affectedTasks.length > 0'
          )"
        fi

        echo "affected=$affected" >> "$GITHUB_OUTPUT"
