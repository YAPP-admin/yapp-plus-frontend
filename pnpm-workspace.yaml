packages:
  - apps/*
  - packages/*

# pnpm 버전은 mise가 packageManager 필드에서 읽어 설치합니다.
# pnpm의 자체 버전 다운로드를 끄고 lockfile은 프로젝트 의존성만 기록합니다.
pmOnFail: ignore

# pnpm은 공개된 지 24시간이 지나지 않은 패키지 설치를 기본적으로 지연합니다.
# 장기간 유지할 minimumReleaseAgeExclude를 추가하지 말고 충분히 검증된 버전을 사용합니다.
catalog:
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/react-vite': 10.6.0
  '@tanstack/react-query': 5.102.8
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  '@vanilla-extract/css': 1.21.2
  '@vanilla-extract/vite-plugin': 5.2.6
  expo-doctor: 1.20.4
  happy-dom: 20.14.0
  react: 19.2.8
  react-dom: 19.2.8
  storybook: 10.6.0
  typescript: 6.0.3
  vite: 8.2.2
  vitest: 5.0.0

catalogs:
  expo:
    react: 19.2.3
    react-dom: 19.2.3

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
