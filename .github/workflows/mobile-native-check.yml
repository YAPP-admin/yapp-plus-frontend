name: Mobile native compatibility

# CI에서 Linux와 macOS에 같은 비교 입력을 전달하는 재사용 workflow입니다.
on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
      runner:
        required: true
        type: string
    outputs:
      native-key:
        value: ${{ jobs.compare.outputs.native-key }}

# PR 설정·플러그인 평가에는 코드 실행이 포함되므로 배포 비밀과 쓰기 권한을 주지 않습니다.
permissions:
  contents: read

jobs:
  compare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    outputs:
      native-key: ${{ steps.compare.outputs.native-key }}
    env:
      MOBILE_WEB_URL: https://yapp-plus-web.vercel.app
    steps:
      # base와 합성 merge 소스를 별도 경로에 두어 각각의 의존성을 설치합니다.
      - name: Checkout base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.base }}
          path: base
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.head }}
          path: candidate
          persist-credentials: false
      # 일반 릴리스 URL의 504를 피하도록 동일한 고정 버전을 공식 API로 받습니다.
      # jdx/mise-action#727이 정식 릴리스에 포함되고 다운로드가 검증되면 이 단계와 mise_dir를 제거합니다.
      - name: Download pinned mise through release API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              asset_id=538186909
              checksum=e1e578f84f4f17fea9d9f1aca66ba50790075283c535b805559ca420b8235c9e
              ;;
            macOS/ARM64)
              asset_id=538186942
              checksum=836fd478f6491b0fa28e0da8371d1d6cb5950d279bd95d66ed87ba18443930a9
              ;;
            *) echo "지원하지 않는 실행 환경: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/mise-2026.8.16.tar.zst"
          gh api -H 'Accept: application/octet-stream' \
            "repos/jdx/mise/releases/assets/$asset_id" > "$archive"
          # 실행·압축 해제 전에 공식 릴리스에서 확인한 고정 SHA-256을 검사합니다.
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/mise-api/bin"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/mise-api/bin" \
            --strip-components=2 mise/bin/mise
          "$RUNNER_TEMP/mise-api/bin/mise" --version
      # PR에서 도구 버전을 바꾸더라도 검사는 base의 고정 도구체인으로 실행합니다.
      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          mise_dir: ${{ runner.temp }}/mise-api
          working_directory: base
          install_args: --locked node
      # pnpm의 GitHub 릴리스 다운로드도 504가 발생하므로 npm 레지스트리를 임시로 사용합니다.
      # 다운로드 정상화 후 이 단계를 제거하고 mise install의 node 제한을 해제합니다.
      - name: Install pinned pnpm from npm registry
        shell: bash
        run: |
          package_manager=$(jq -er '.packageManager | select(test("^pnpm@[0-9]+\\.[0-9]+\\.[0-9]+$"))' base/package.json)
          npm install --global --prefix "$RUNNER_TEMP/pnpm" --ignore-scripts \
            --registry=https://registry.npmjs.org "$package_manager"
          test "$("$RUNNER_TEMP/pnpm/bin/pnpm" --version)" = "${package_manager#pnpm@}"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      # 검사 대상 PR이 자신의 버전 검사 로직을 동시에 완화하지 않도록 base 코드를 보존합니다.
      - name: Keep base policy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-policy"
          for file in native-snapshot.ts delivery-policy.ts; do
            source="base/apps/mobile/scripts/$file"
            if [ ! -f "$source" ]; then
              # 최초 도입 PR만 후보 정책을 사용합니다. 이후 PR은 base 정책으로 검사합니다.
              source="candidate/apps/mobile/scripts/$file"
              echo '최초 도입: 검사 정책 자체의 리뷰가 필요합니다.' >> "$GITHUB_STEP_SUMMARY"
            fi
            cp "$source" "$RUNNER_TEMP/mobile-policy/$file"
          done
      # 설치 lifecycle은 실행하지 않습니다. Expo 설정 평가는 필요하므로 이 job에는 비밀을 전달하지 않습니다.
      # 공식 fingerprint Action은 이전 지문을 캐시 DB에서 조회합니다. 여기서는 양쪽 소스를 직접 계산합니다.
      - name: Install and inspect isolated checkouts
        shell: bash
        run: |
          for tree in base candidate; do
            (cd "$tree" && pnpm install --frozen-lockfile --ignore-scripts)
            mkdir -p "$tree/apps/mobile/scripts"
            cp "$RUNNER_TEMP/mobile-policy/native-snapshot.ts" "$tree/apps/mobile/scripts/.native-check.ts"
            node "$tree/apps/mobile/scripts/.native-check.ts" "$tree" "$RUNNER_TEMP/$tree-native.json"
          done
      # 지문 계산은 Expo에 맡기고, 네이티브 변경 시 앱 버전 증가라는 프로젝트 규칙만 비교합니다.
      # 공개된 버전과 해시만 output/Summary에 남기며 원시 Expo config는 출력하지 않습니다.
      - name: Check version policy
        id: compare
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const temp = process.env.RUNNER_TEMP;
          const { compareNative } = await import(pathToFileURL(`${temp}/mobile-policy/delivery-policy.ts`));
          const base = JSON.parse(readFileSync(`${temp}/base-native.json`, 'utf8'));
          const head = JSON.parse(readFileSync(`${temp}/candidate-native.json`, 'utf8'));
          const result = compareNative(base, head);
          appendFileSync(process.env.GITHUB_OUTPUT, `native-key=${base.version}:${base.fingerprint}:${base.nativeBuildDigest}/${head.version}:${head.fingerprint}:${head.nativeBuildDigest}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `앱 버전: ${base.version} → ${head.version}\n\n네이티브 변경: ${result.nativeChanged}\n\n새 빌드 필요: ${result.needsBuild}\n`);
          JS
