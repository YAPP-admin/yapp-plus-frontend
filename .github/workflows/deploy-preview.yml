name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: deploy-preview-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve-pr:
    name: Resolve pull request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      number: ${{ steps.pr.outputs.number }}
      should_deploy: ${{ steps.pr.outputs.should_deploy }}
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          else
            # workflow_run payload의 PR 배열이 비어 있으면 head SHA로 같은 저장소 PR을 다시 찾습니다.
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0] // empty')"
            PR_NUMBER="$(echo "$pr_json" | jq -r '.number // ""')"
          fi

          if [ -z "$PR_NUMBER" ] || [ -z "$pr_json" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(echo "$pr_json" | jq -r '.base.sha')"
          head_branch="$(echo "$pr_json" | jq -r '.head.ref')"
          head_repo="$(echo "$pr_json" | jq -r '.head.repo.full_name')"
          head_sha="$(echo "$pr_json" | jq -r '.head.sha')"

          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$RUN_ACTOR" = "dependabot[bot]" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$head_sha" != "$HEAD_SHA" ]; then
            echo "::error title=Outdated PR context::CI가 검증한 commit과 현재 PR head가 다릅니다."
            exit 1
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy ${{ matrix.app }} Preview
    if: needs.resolve-pr.outputs.should_deploy == 'true'
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Web
            app_id: web
            workspace: '@yapp-plus/web'
            project_id: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          - app: Admin
            app_id: admin
            workspace: '@yapp-plus/admin'
            project_id: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve-pr.outputs.head_sha }}

      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: --locked

      - name: Detect affected build
        id: affected
        uses: ./.github/actions/turbo-affected
        with:
          workspace: ${{ matrix.workspace }}
          base: ${{ needs.resolve-pr.outputs.base_sha }}
          head: ${{ needs.resolve-pr.outputs.head_sha }}
          deployment-config-paths: |
            .github/workflows/deploy-preview.yml
            .github/workflows/cd.yml
            .github/workflows/deploy-manual.yml
            .github/actions/turbo-affected/action.yml
            .github/actions/vercel-deploy/action.yml

      - name: Write skipped Preview summary
        if: steps.affected.outputs.affected == 'false'
        run: |
          echo "### ${{ matrix.app }} Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "빌드 입력과 배포 설정에 영향을 주는 변경이 없어 배포를 생략했습니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Preview
        id: deploy
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/vercel-deploy
        with:
          environment: preview
          org-id: ${{ vars.VERCEL_ORG_ID }}
          project-id: ${{ matrix.project_id }}
          token: ${{ secrets.VERCEL_TOKEN }}
          git-branch: ${{ needs.resolve-pr.outputs.head_branch }}

      - name: Write Preview summary
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### ${{ matrix.app }} Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Preview comment
        if: always() && steps.affected.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number_force: ${{ needs.resolve-pr.outputs.number }}
          header: yapp-plus-preview-${{ matrix.app_id }}
          message: |
            ### ${{ matrix.app }} Preview

            ${{ steps.affected.outputs.affected != 'true' && '빌드 입력과 배포 설정에 영향을 주는 변경이 없어 새 Preview 배포를 생략했습니다.' || steps.deploy.outcome == 'success' && format('[Preview 배포 열기]({0})', steps.deploy.outputs.deployment-url) || format('Preview 배포에 실패했습니다. [실행 로그 확인]({0}/{1}/actions/runs/{2})', github.server_url, github.repository, github.run_id) }}

            Commit: `${{ needs.resolve-pr.outputs.head_sha }}`
          skip_unchanged: true
