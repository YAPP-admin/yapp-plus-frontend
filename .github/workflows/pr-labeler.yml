name: PR 라벨 자동화

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: 크기 및 경로 라벨 동기화
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 크기 라벨 동기화
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IGNORED: |
            pnpm-lock.yaml
            apps/admin/src/routeTree.gen.ts
            packages/api/src/generated/**
        with:
          sizes: |
            {
              "0": "XS",
              "20": "S",
              "50": "M",
              "200": "L",
              "500": "XL"
            }

      - name: 경로 라벨 동기화
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
