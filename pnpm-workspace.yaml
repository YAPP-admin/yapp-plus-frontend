  - '@expo/metro-config@58.0.21 || 58.0.22'
  - '@expo/prebuild-config@58.0.19 || 58.0.20'
  - '@expo/require-utils@58.0.5 || 58.0.6'
  - '@expo/router-server@58.0.21 || 58.0.22'
  - babel-preset-expo@58.0.24 || 58.0.25
  - expo-asset@58.0.20 || 58.0.21
  - expo-constants@58.0.15 || 58.0.16
  - expo-file-system@58.0.13
  - expo-font@58.0.11 || 58.0.12
  - expo-linking@58.0.16 || 58.0.17
  - expo-modules-autolinking@58.0.17 || 58.1.0
  - expo-modules-cli@0.4.0 || 0.5.0
  - expo-modules-core@58.0.30 || 58.1.0
  - expo-modules-jsi@58.0.22 || 58.0.23
  - expo-router@58.0.30 || 58.0.31
  - expo-splash-screen@58.0.13 || 58.0.14
  - expo-system-ui@58.0.7
  - expo@58.0.23 || 58.0.24
  - '@expo/fingerprint@0.21.9 || 0.21.10'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-runtime@58.0.17'
  - '@expo/schema-utils@58.0.3'
  - nitro-core@0.37.2
  - react-native-nitro-modules@0.37.2
  - '@expo/env@2.5.4 || 2.6.0'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - expo-apple-authentication@58.0.3
  - expo-crypto@58.0.8
  - expo-dev-client@58.0.19
