name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate workflow syntax and expressions
        # PR checkout의 YAML을 검사합니다. 배포 Secret이나 Vercel 호출은 사용하지 않습니다.
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TEAM: yapp-plus
    # Turbo가 각 명령 안에서 앱과 패키지 태스크를 병렬 실행합니다.
    # Matrix를 사용하지 않아 도구 체인과 의존성 설치가 중복되지 않도록 합니다.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mobile changes
        id: mobile-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if .github/scripts/has-mobile-changes.sh "$BASE_SHA" "$GITHUB_SHA"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm lint

      - name: Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm typecheck

      - name: Test
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm test

      - name: Build
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm build

      - name: Run Expo Doctor
        if: steps.mobile-changes.outputs.changed == 'true'
        run: pnpm expo:doctor
