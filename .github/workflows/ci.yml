name: 지속적 통합

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Turbo가 각 명령 안에서 앱과 패키지 태스크를 병렬 실행합니다.
    # Matrix를 사용하지 않아 도구 체인과 의존성 설치가 중복되지 않도록 합니다.
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 도구 체인 설치
        uses: jdx/mise-action@v4
        with:
          install_args: --locked

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: Expo 프로젝트 검사
        run: pnpm expo:doctor
