name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Turbo가 각 명령 안에서 앱과 패키지 태스크를 병렬 실행합니다.
    # Matrix를 사용하지 않아 도구 체인과 의존성 설치가 중복되지 않도록 합니다.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Run Expo Doctor
        run: pnpm expo:doctor

  deploy-preview:
    name: Deploy ${{ matrix.app }} Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: verify
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Web
            app_id: web
            workspace: '@yapp-plus/web'
            project_id: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          - app: Admin
            app_id: admin
            workspace: '@yapp-plus/admin'
            project_id: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: --locked

      - name: Detect affected build
        id: affected
        uses: ./.github/actions/turbo-affected
        with:
          workspace: ${{ matrix.workspace }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Write skipped Preview summary
        if: steps.affected.outputs.affected == 'false'
        run: |
          echo "### ${{ matrix.app }} Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "빌드 입력에 영향을 주는 변경이 없어 배포를 생략했습니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Preview
        id: deploy
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/vercel-deploy
        with:
          environment: preview
          org-id: ${{ vars.VERCEL_ORG_ID }}
          project-id: ${{ matrix.project_id }}
          token: ${{ secrets.VERCEL_TOKEN }}
          git-branch: ${{ github.head_ref }}

      - name: Write Preview summary
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### ${{ matrix.app }} Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Preview comment
        if: always() && steps.affected.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: yapp-plus-preview-${{ matrix.app_id }}
          message: |
            ### ${{ matrix.app }} Preview

            ${{ steps.affected.outputs.affected != 'true' && '빌드 입력에 영향을 주는 변경이 없어 새 Preview 배포를 생략했습니다.' || steps.deploy.outcome == 'success' && format('[Preview 배포 열기]({0})', steps.deploy.outputs.deployment-url) || format('Preview 배포에 실패했습니다. [실행 로그 확인]({0}/{1}/actions/runs/{2})', github.server_url, github.repository, github.run_id) }}

            Commit: `${{ github.event.pull_request.head.sha }}`
          skip_unchanged: true
