name: Mobile TestFlight manual

# 빌드와 제출은 별도 수동 실행입니다. main에 병합된 workflow만 운영에 사용합니다.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 실행할 작업
        type: choice
        options: [build, submit]
        required: true
      build_run_id:
        description: 제출할 빌드의 GitHub Actions 실행 ID (submit 필수)
        type: string
      build_attempt:
        description: 제출할 빌드의 실행 회차 (submit에만 사용)
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

# 자동 OTA와 실행이 겹치지 않게 합니다. 실행 중인 작업을 새 요청으로 취소하지 않습니다.
concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # 입력을 shell 코드에 삽입하지 않고 환경 변수로 전달합니다.
      - name: Verify source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPERATION: ${{ inputs.operation }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
        run: |
          if [ "$OPERATION" = build ]; then
            # dispatch가 선택한 main SHA를 검사합니다. CI가 아직 성공하지 않았으면 실행을 실패시킵니다.
            gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success \
              --jq '.total_count > 0' | grep -qx true
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$OPERATION" = submit ]; then
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
            # 최신 실행을 추측하지 않고 사용자가 지정한 회차의 출처와 성공 여부를 확인합니다.
            gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/attempts/$BUILD_ATTEMPT" > "$RUNNER_TEMP/build-run.json"
            jq -e --arg repo "$GH_REPO" '
              .conclusion == "success" and .event == "workflow_dispatch" and
              .head_branch == "main" and .head_repository.full_name == $repo and
              .path == ".github/workflows/mobile-manual.yml"
            ' "$RUNNER_TEMP/build-run.json" > /dev/null
            sha=$(jq -r .head_sha "$RUNNER_TEMP/build-run.json")
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  build:
    needs: source
    if: inputs.operation == 'build'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # EAS local build는 eas.json의 cloud 도구 버전을 적용하지 않으므로 runner에서 선택합니다.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.16
          install_args: --locked
      # runner 업데이트로 버전이 바뀌면 묵인하지 않고 도구체인 검토를 요구합니다.
      - name: Verify native toolchain
        run: |
          xcodebuild -version | grep -qx 'Xcode 26.6'
          test "$(ruby -e 'print RUBY_VERSION')" = '3.4.12'
          test "$(pod --version)" = '1.17.0'
          test "$(ruby -e "require 'rubygems'; print Gem::Specification.find_by_name('fastlane').version")" = '2.241.2'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up EAS CLI
        uses: ./.github/actions/setup-eas
      # 원격 서명 자격 증명과 build number를 사용하지만 실제 빌드는 GitHub macOS에서 수행합니다.
      - name: Build local IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: >-
          eas build --local --platform ios --profile testflight --non-interactive
          --output "$RUNNER_TEMP/app.ipa"
      - name: Record IPA checksum
        working-directory: ${{ runner.temp }}
        run: shasum -a 256 app.ipa > app.ipa.sha256
      # 재실행 회차별로 이름을 분리합니다. 인증서·프로비저닝·원시 빌드 로그는 업로드하지 않습니다.
      - name: Upload IPA
        id: ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-ipa-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app.ipa
            ${{ runner.temp }}/app.ipa.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Summarize build
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          {
            echo "소스: $SOURCE_SHA"
            echo "빌드 실행 ID: $GITHUB_RUN_ID / 회차: $GITHUB_RUN_ATTEMPT"
            echo "IPA: $ARTIFACT_URL"
            echo '제출하려면 submit 작업에서 위 실행 ID와 회차를 지정하세요.'
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    needs: source
    if: inputs.operation == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 현재 main이 아닌 IPA를 만든 소스의 제출 설정을 사용합니다.
      - name: Checkout build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Download selected IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testflight-ipa-${{ inputs.build_attempt }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ipa
      - name: Verify IPA checksum
        working-directory: ${{ runner.temp }}/ipa
        run: shasum -a 256 --check app.ipa.sha256
      - name: Set up toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.16
          install_args: --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set up EAS CLI
        uses: ./.github/actions/setup-eas
      # --latest를 사용하지 않습니다. 선택한 IPA만 업로드하고 EAS 제출 결과를 기다립니다.
      - name: Submit selected IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: >-
          eas submit --platform ios --profile testflight --non-interactive --wait
          --path "$RUNNER_TEMP/ipa/app.ipa"
