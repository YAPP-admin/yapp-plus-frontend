name: Mobile TestFlight update

# CI 성공 후 검증된 main의 JavaScript와 asset을 TestFlight 채널에 게시합니다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# 후속 자동·수동 배포도 같은 그룹을 사용합니다. 실행 중인 작업을 새 push로 취소하지 않습니다.
concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  # 다른 저장소의 PR 실행이나 실패한 CI는 후보로 받지 않습니다.
  candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # 같은 이름의 다른 workflow와 뒤늦게 완료된 과거 main CI를 제외합니다.
      - name: Verify CI source and latest main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          test "$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID" --jq .path)" = .github/workflows/ci.yml
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$CANDIDATE" ]; then
            echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo '오래된 CI 결과: 최신 main의 성공을 기다립니다.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # 빌드 존재·설치 확인 여부로 분기하지 않습니다. Turbo가 모바일 영향을 판단합니다.
  update:
    needs: candidate
    if: needs.candidate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MOBILE_WEB_URL: https://yapp-plus-web.vercel.app
    steps:
      # workflow_run의 기본 SHA 대신 CI가 실제로 검증한 SHA를 사용합니다.
      - name: Checkout validated SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # CLI 설치에는 인증 정보가 필요하지 않습니다. token은 EAS 조회·게시 단계에만 전달합니다.
      - name: Set up EAS CLI
        uses: ./.github/actions/setup-eas
      # 조회 실패는 배포 생략 사유가 아닙니다. outcome으로 실제 성공 여부를 확인합니다.
      - name: Find last published SHA
        id: baseline
        continue-on-error: true
        shell: bash
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update:list --branch testflight --platform ios --limit 1 --json --non-interactive > "$RUNNER_TEMP/updates.json"
          group=$(jq -er '
            .currentPage[0] | select(.isRollBackToEmbedded == false) |
            .group | strings | select(test("^[a-f0-9-]{36}$"))
          ' "$RUNNER_TEMP/updates.json")
          eas update:view "$group" --json > "$RUNNER_TEMP/update.json"
          base=$(jq -er '
            [.[] | select(.platform == "ios" and .branch == "testflight" and .isRollBackToEmbedded == false)][0] |
            .gitCommitHash | strings | select(test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/update.json")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # 공용 패키지의 의존성 전파는 Turbo가 처리합니다. 판정 실패도 게시로 처리합니다.
      - name: Check mobile impact
        id: impact
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TURBO_SCM_BASE: ${{ steps.baseline.outputs.sha }}
          TURBO_SCM_HEAD: ${{ needs.candidate.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD"
          pnpm exec turbo ls --affected --output=json > "$RUNNER_TEMP/affected.json"
          publish=$(jq -er '
            .packages.items |
            if type == "array" and all(.[]; (.name | type) == "string")
            then any(.[]; .name == "@yapp-plus/mobile") | tostring
            else error("invalid package list") end
          ' "$RUNNER_TEMP/affected.json")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      # 설치 중 main이 바뀌었으면 게시하지 않습니다. 다음 최신 CI 성공이 게시를 담당합니다.
      - name: Recheck latest main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.candidate.outputs.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$CANDIDATE" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      # 게시 기록 조회와 영향 판정만 오류를 허용합니다. 최신 SHA 조회·실제 게시 실패는 그대로 실패합니다.
      - name: Summarize publication decision
        id: decision
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
          IMPACT_RESULT: ${{ steps.impact.outcome }}
          PUBLISH: ${{ steps.latest.outputs.publish == 'true' && (steps.impact.outcome != 'success' || steps.impact.outputs.publish != 'false') }}
        run: |
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          {
            echo "비교: ${BASE_SHA:-없음} → $SOURCE_SHA"
            echo "게시 기록 조회: $BASELINE_RESULT / Turbo 판정: $IMPACT_RESULT"
            echo "OTA 게시: $PUBLISH (최신 main이며 영향이 없다고 확인되지 않으면 게시)"
          } >> "$GITHUB_STEP_SUMMARY"
      # runtime은 appVersion입니다. 새 버전의 OTA는 기존 버전의 앱에 전달되지 않습니다.
      # 같은 SHA의 게시가 확인되면 생략합니다. 조회 실패 시 중복 게시 가능성은 유지합니다.
      - name: Publish TestFlight update
        if: steps.decision.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
        run: >-
          eas update --platform ios --channel testflight --environment production
          --message "main:$SOURCE_SHA run:$GITHUB_RUN_ID attempt:$GITHUB_RUN_ATTEMPT"
          --non-interactive
