name: CI

on:
  # 종속 PR도 검사하도록 병합 대상 브랜치를 제한하지 않습니다.
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TEAM: yapp-plus
    # Turbo가 각 명령 안에서 앱과 패키지 태스크를 병렬 실행합니다.
    # Matrix를 사용하지 않아 도구 체인과 의존성 설치가 중복되지 않도록 합니다.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: node --run format:check

      - name: Lint
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --run lint

      - name: Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --run typecheck

      - name: Test
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --run test

      - name: Build
        env:
          TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --run build

      # 공용 의존성 변경도 빠짐없이 확인하도록 Doctor를 매번 실행합니다.
      - name: Run Expo Doctor
        run: node --run expo:doctor

  # 변경 경로와 관계없이 모든 PR에서 두 OS의 네이티브 호환성을 검사합니다.
  # secrets를 전달하지 않는 별도 job이므로 기존 Verify의 Turbo token을 공유하지 않습니다.
  mobile-native-linux:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mobile-native-check.yml
    permissions:
      contents: read
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.sha }}
      runner: ubuntu-latest

  mobile-native-macos:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mobile-native-check.yml
    permissions:
      contents: read
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.sha }}
      runner: macos-15

  # 한쪽 검사 실패·건너뛰기 또는 OS별 지문 차이가 있으면 최종 검사를 실패시킵니다.
  mobile-native:
    name: Mobile native compatibility
    if: always() && github.event_name == 'pull_request'
    needs: [mobile-native-linux, mobile-native-macos]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require matching results on both operating systems
        env:
          LINUX_RESULT: ${{ needs.mobile-native-linux.result }}
          MACOS_RESULT: ${{ needs.mobile-native-macos.result }}
          LINUX_KEY: ${{ needs.mobile-native-linux.outputs.native-key }}
          MACOS_KEY: ${{ needs.mobile-native-macos.outputs.native-key }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
          test -n "$LINUX_KEY"
          test "$LINUX_KEY" = "$MACOS_KEY"
