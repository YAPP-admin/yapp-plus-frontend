packages:
  - apps/*
  - packages/*

# pnpm 버전은 mise가 packageManager 필드에서 읽어 설치합니다.
# pnpm의 자체 버전 다운로드를 끄고 lockfile은 프로젝트 의존성만 기록합니다.
pmOnFail: ignore

# pnpm은 공개된 지 24시간이 지나지 않은 패키지 설치를 기본적으로 지연합니다.
# 장기간 유지할 minimumReleaseAgeExclude를 추가하지 말고 충분히 검증된 버전을 사용합니다.
catalog:
  '@faker-js/faker': 10.6.0
  '@tiptap/core': 3.32.0
  '@tiptap/react': 3.32.0
  '@tiptap/pm': 3.32.0
  '@tiptap/starter-kit': 3.32.0
  '@tiptap/extension-placeholder': 3.32.0
  '@karrotmarket/react-monochrome-icon': 1.30.0
  '@testing-library/user-event': 14.6.7
  '@seed-design/css': 2.8.3
  '@seed-design/react': 2.5.0
  '@seed-design/vite-plugin': 2.1.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/react-vite': 10.6.0
  '@tanstack/react-table': 9.3.1
  '@tanstack/react-query': 5.102.8
  '@tanstack/react-form': 1.33.5
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  '@vanilla-extract/css': 1.21.2
  '@vanilla-extract/vite-plugin': 5.2.6
  expo-doctor: 1.20.4
  lucide-react: 1.59.0
  happy-dom: 20.14.0
  kakao.maps.d.ts: 0.1.40
  msw: 2.15.0
  ky: 2.1.0
  proj4: 2.22.0
  overlay-kit: 1.9.0
  oxc-transform-react: 0.155.0
  react: 19.2.8
  react-dom: 19.2.8
  react-kakao-maps-sdk: 1.2.2
  storybook: 10.6.0
  typescript: 6.0.3
  vite: 8.2.2
  vitest: 5.0.0
  zod: 4.5.4

catalogs:
  expo:
    '@types/react': 19.3.0
    react: 19.3.0
    react-dom: 19.3.0

allowBuilds:
  '@swc/core': true
  esbuild: true
  lefthook: true
  # worker는 msw init으로 명시적으로 생성합니다. MSW 업그레이드 시 자동 복사 정책을 재검토합니다.
  msw@2.15.0: false

patchedDependencies:
  '@seed-design/react-wheel-picker@1.1.1': patches/@seed-design__react-wheel-picker@1.1.1.patch
  '@seed-design/react@2.5.0': patches/@seed-design__react@2.5.0.patch

# Expo SDK 58 업데이트 패키지는 lockfile 검증을 마친 뒤 24시간 release age 예외를 제거합니다.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.18'
  - '@expo/config-plugins@58.0.11'
  - '@expo/config@58.0.10'
  - '@expo/image-utils@0.12.6'
  - '@expo/inline-modules@0.2.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/metro-config@58.0.20'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/require-utils@58.0.5'
  - '@expo/router-server@58.0.20'
  - babel-preset-expo@58.0.23
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-linking@58.0.15
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
  - expo-modules-core@58.0.29
  - expo-modules-jsi@58.0.21
  - expo-router@58.0.29
  - expo-splash-screen@58.0.12
  - expo-system-ui@58.0.7
  - expo@58.0.22
  - '@expo/fingerprint@0.21.8'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/schema-utils@58.0.3'
