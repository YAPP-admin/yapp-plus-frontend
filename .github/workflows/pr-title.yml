name: PR Title

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title length
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#PR_TITLE}" -gt 100 ]; then
            echo "::error title=PR title too long::PR 제목은 100자 이하여야 합니다."
            exit 1
          fi

      - name: Validate title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          subjectPattern: '^(?!.*\.$).+$'
          subjectPatternError: PR 제목의 subject는 마침표로 끝날 수 없습니다.
